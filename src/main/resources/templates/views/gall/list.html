            <ul class="item-body">

      </section>
      <section class="page-box">
          <nav aria-label="Page navigation example">
              <ul class="pagination justify-content-center"   id="pageBox">
                <li class="page-item disabled">
                  <a class="page-link">Previous</a>
                </li>
                <li class="page-item"><a class="page-link" href="#">1</a></li>

            </nav>
      </section>
    </main>
    <div class="modal" tabindex="-1"  id="registerModal">
		  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" >
			    <div class="modal-content">
				      <div class="modal-header">
				        <h5 class="modal-title">갤러리 추가</h5>
				        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				      </div>
				      <div class="modal-body">
				          <form  id="addForm">
				                <div class='row mb-3'>
				                     <div  class="col-auto  pt-1"  >
				                          <label for="title" class="form-label">제목 : </label>
				                     </div>
				                     <div  class="col-9">
				                            <input type="text" class="form-control"   id="title"   name="title">
				                     </div>
				                </div>
				                     <div class='row mb-3'>
				                     <div  class="col-auto  pt-1"  >
				                          <label for="title" class="form-label">파일 : </label>
				                     </div>
				                     <div  class="col-9">
				                            <input type="file" class="form-control"   id="file"   name="file">
				                     </div>
				                </div>
				          </form>
				      </div>
				      <div class="modal-footer">
				        <button type="button" class="btn btn-primary" onclick="addGallery();">등록</button>
				        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				      </div>
			    </div>
		  </div> 
     </div>
     
     <script>
             
     
         function getGalleryData(pageNum) {
        	  const nextPage = pageNum  ||  0;
        	  const dataParm = {
        			  nowPage : nextPage
        	  }
        	 
        	  $.ajax(
   				  {
   						url : '/gall/list/data',
   						type : 'get',
   						dataType : 'json',
   						data :  dataParm
   		          }
   		    ).done(function(res){
   			      drawGallery(res);
	   		  }).fail(function(xhr, error, status){
	   			  alert(error);
	   		  })
         }
         
         function drawGallery(res) {
        	 
        	 const galleryBox = $('#gallery-box');
        	 const nowPage = $('#nowPage');
        	 const pageBox = $('#pageBox');
        	 galleryBox.empty(); // 비우기 
        	 pageBox.empty();
        	 
        	 //페이지 갱신 
        	 nowPage.val(res.nowPage);
        	 
        	 $.each(res.dataList,    (index, obj)  => {
        		//html  그리기
        		 const html = makeGalleryHtml(obj);
        		 galleryBox.append(html);
        	 });
        	 
        	 //페이징 처리 
        	 pageBox.append(res.pageHtml);
        	 
         }
         
         function  makeGalleryHtml(data) {
        
           const itemBox =    $('<div class="item-box"></div>');
           const itemBody =  $(' <ul class="item-body"></ul>');
           const checkBox =  $('<li></li>');
           const imgBox =      $('<li class="img-box"></li>');	 
           const textBox =     $('  <li class="text-box"></li>');
           
           checkBox.append(`<input type='checkbox'  id='gall_${data.seq}'     value='${data.seq}'  >`);
           imgBox.append(`<img src='/gall/img/${data.fileStoredName}'>     `);
           textBox.append(` <h5 class="card-title">${data.title}</h5>`);
           textBox.append(` <p>${data.updateDate}</p>`);
           
           itemBody.append(checkBox);
           itemBody.append(imgBox);
           itemBody.append(textBox);
           
           itemBox.append(itemBody);
        	 
           return itemBox;
        	 
         }
         
         
         
     
     
           function registerModal(){
            	   const registerModal = $('#registerModal');
            	   
            	   //모달창 없어질때 실행 이벤트  >>   모달창 사라질 때  선택 내용 지우자 
            	   registerModal.on('hide.bs.modal', (event)=>{
            		     $('#title').val('');
            		     $('#file').val('');
            	   });
            	   
            	   registerModal.modal('show');
             }
       
           
           function validated () {
        	      const title = $('#title');
        	      const fileObj = $('#file');
        	      
        	      if($.trim( title.val() ).length === 0   ) {
        	    	  alert('제목을 입력하십시오');
        	    	  return false;
        	      }
        	      
        	      
        	      if(fileObj.val().length === 0   ) {
        	    	  alert('등록할 파일(이미지)를  입력하십시오');
        	    	  return false;
        	      }
        	      
        	      const imageExtensions  = ['jpg', 'jpeg', 'png', 'gif',  'bmp' ,'ico']  ;
        	      //파일 검증 
        	      const fileName = fileObj.val();  
        	      const ext =     fileName.substring(  fileName.lastIndexOf('.') +1  );
        	      
        	      
        	      if(  $.inArray(ext,  imageExtensions)  ===  -1) {
        	    	   alert('이미자파일만 등록 가능합니다.');
        	    	   return false;
        	      }
        	      
        	      return true;
           }
           
           
            function addGallery() {
            	
            	if( validated () ) {
            		
            		  //formData 만들기 
            		  const formObj = $('#addForm')[0];
            		  const formData =  new FormData(formObj);
            		  
            		  $.ajax(
            				  {
            						url : '/gall/add',
            						type : 'post',
            						dataType : 'json',
            						data : formData,
            						contentType : false,   // ajax 기본 타입  xxx-formed-encoded 를 안쓴다!
            						processData : false, // queryString 으로 데이터 전송 안함 
            						enctype : 'multipart/form-data'    // 파일과 함께 데이터를 전송  
            		          }
            		    ).done(function(res){
            		    	if(res.resultCode === 200) {
            		    		alert('갤러리 이미지가 등록되었습니다.');
            		    	}else {
            		    		alert('갤러리 이미지 등록이 실패되었습니다.');
            		    	}
            			  
            		  }).fail(function(xhr, error, status){
            			  alert(error);
            		  })
            		
            	}
            }
            
            
            $(document).ready( ()=>{
            	   getGalleryData();
            });
             
     </script>
</div>
